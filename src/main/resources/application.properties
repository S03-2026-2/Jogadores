spring.application.name=jogadores

jwt.secret=${JWT_SECRET}
jwt.expiracao-minutos=60

# Broker (pub/sub de outra equipe): URL e timeouts de 2s para não travar o cadastro
broker.url=${BROKER_URL:http://localhost:8000}
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=2s

# Banco H2 em memoria (desenvolvimento)
spring.datasource.url=jdbc:h2:mem:jogadores
spring.datasource.username=sa
spring.datasource.password=

# Hibernate cria as tabelas a partir das entidades ao subir e apaga ao desligar
spring.jpa.hibernate.ddl-auto=create-drop
# Mostra no console o SQL gerado
spring.jpa.show-sql=true